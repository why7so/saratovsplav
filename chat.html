<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://bwadwksnzcltbswktibs.supabase.co;">
<title>Чат-бот — Сплав</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Unbounded:wght@300;400;700&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="img/ico.png" type="image/x-icon">
<link rel="stylesheet" href="css/nav.css">
<style>
  :root {--river:#1a4a5c;--river-light:#2d7a9a;--river-pale:#a8d8e8;--cream:#f5f0e8;--text:#1a1a18;--white:#fdfaf5;--text-muted:#5a5248}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Mulish',sans-serif;background:var(--cream);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;padding-top:4rem}
  @media(min-width:769px){
    .chat-wrap{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1}
    .chat-messages{flex:1}
    .quick-replies{padding-left:0;padding-right:0}
    .chat-input{border-radius:12px;margin:0 1rem 1rem;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
  }
  .chat-messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
  .msg{max-width:80%;min-width:0;padding:.75rem 1rem;border-radius:12px;font-size:.88rem;line-height:1.5;animation:msgIn .2s ease;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;white-space:pre-wrap}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg-bot{background:var(--white);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .msg-user{background:var(--river);color:var(--white);align-self:flex-end;border-bottom-right-radius:4px}
  .msg-typing{display:flex;gap:4px;padding:.75rem 1rem}
  .msg-typing span{width:6px;height:6px;background:var(--river-light);border-radius:50%;animation:dot 1.2s infinite}
  .msg-typing span:nth-child(2){animation-delay:.2s}
  .msg-typing span:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
  .quick-replies{display:flex;gap:.4rem;padding:0 1.5rem .5rem;flex-wrap:wrap}
  .quick-btn{background:var(--white);border:1px solid var(--river-pale);color:var(--river);padding:.4rem .8rem;border-radius:16px;font-size:.78rem;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
  .quick-btn:hover{background:var(--river);color:var(--white);border-color:var(--river)}
  .chat-input{display:flex;gap:.5rem;padding:1rem 1.5rem;background:var(--white);border-top:1px solid #e0d8cc}
  .chat-input input{flex:1;padding:.7rem 1rem;border:1.5px solid #e0d8cc;border-radius:24px;font-family:'Inter',sans-serif;font-size:.88rem;outline:none}
  .chat-input input:focus{border-color:var(--river)}
  .chat-input button{width:40px;height:40px;background:var(--river);color:var(--white);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .chat-input button:hover{background:var(--river-light)}
  .chat-input button:disabled{background:#ccc;cursor:default}
  .chat-input button svg{width:18px;height:18px}
  @media(max-width:480px){.msg{max-width:90%}}

</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <img src="img/logo.png" alt="Сплав">
    <span class="logo-text">Сплав</span>
    <span class="nav-subtitle">Помощник — Отвечает о турах, реках и записях</span>
  </a>
  <ul id="nav-desktop-menu">
    <li><a href="index.html#home" data-nav="home">Главная</a></li>
    <li><a href="index.html#rivers" data-nav="rivers">Реки</a></li>
    <li><a href="index.html#tours" data-nav="tours">Сплавы</a></li>
    <li><a href="index.html#reviews" data-nav="reviews">Отзывы</a></li>
    <li><a href="chat.html">Чат</a></li>
    <li><a href="auth.html" class="nav-login" id="nav-login-link">Войти</a></li>
  </ul>
  <div class="nav-mobile-panel" id="nav-menu">
    <div class="nav-mobile-header">
      <span class="nav-mobile-title">Меню</span>
      <button class="nav-mobile-close" id="nav-mobile-close" aria-label="Закрыть меню">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><line x1="4" y1="4" x2="16" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="4" x2="4" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <ul class="nav-mobile-links">
      <li><a href="index.html#home" data-nav="home">Главная</a></li>
      <li><a href="index.html#rivers" data-nav="rivers">Реки</a></li>
      <li><a href="index.html#tours" data-nav="tours">Сплавы</a></li>
      <li><a href="index.html#reviews" data-nav="reviews">Отзывы</a></li>
      <li><a href="chat.html">Чат</a></li>
      <li><a href="auth.html" class="nav-login">Войти</a></li>
    </ul>
  </div>
  <div class="nav-indicator" id="nav-indicator"></div>
  <button class="nav-burger" id="nav-burger" aria-label="Открыть меню" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-overlay" id="nav-overlay"></div>
</nav>

<div class="chat-wrap">
<div class="chat-messages" id="chat-messages">
  <div class="msg msg-bot">Привет! Я помощник «Сплав». Могу рассказать о сплавах, реках, турах и помочь с записью. Задавайте вопросы!</div>
</div>

<div class="chat-input">
  <input type="text" id="chat-input" placeholder="Напишите сообщение..." autocomplete="off">
  <button id="send-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</div>
</div>


<script src="js/chat-page.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/nav.js"></script>
<script src="js/site-tracker.js"></script>
<script src="js/cookie-consent.js"></script>
<script src="js/nav-mobile.js"></script>
</body>
</html>
